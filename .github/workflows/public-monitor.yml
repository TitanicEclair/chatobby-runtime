name: Public release and catalogue monitor
on:
  release:
    types: [published]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Releases are immutable; operational checks use the reviewed current baseline.
          ref: main
          persist-credentials: false
      - name: Record reviewed monitor revision
        run: git rev-parse HEAD
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.21.1'
      - name: Verify runtime publication or complete paired release and catalogue
        env:
          GH_TOKEN: ${{ github.token }}
          CHATOBBY_CATALOGUE_AUTOMATION_ENABLED: ${{ vars.CHATOBBY_CATALOGUE_AUTOMATION_ENABLED }}
        run: node scripts/monitor-public.mjs
